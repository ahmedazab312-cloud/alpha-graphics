<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha Graphics</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f2f6;--sf:#fff;--ink:#1b1f3b;--mu:#667;--ln:#dcdee9;--ac:#3b3fd8;--ai:#fff;--ok:#12805c;--no:#c2412d;--wa:#a86a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12132a;--sf:#1c1e3a;--ink:#eceefb;--mu:#9a9fc4;--ln:#31345a;--ac:#8c90ff;--ai:#12132a;--ok:#4cc99b;--no:#f08a76;--wa:#e8b04a}}
:root[data-theme="dark"]{--bg:#12132a;--sf:#1c1e3a;--ink:#eceefb;--mu:#9a9fc4;--ln:#31345a;--ac:#8c90ff;--ai:#12132a;--ok:#4cc99b;--no:#f08a76;--wa:#e8b04a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 0 2px;font-weight:800}
.sync{font-size:12px;color:var(--mu);margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
nav button{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
nav button.on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.tab{display:none}.tab.on{display:block}
section{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
.r{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.r>*{flex:1;min-width:120px}
input,select,textarea{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:80px}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.b{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--ai);font:inherit;font-weight:800;cursor:pointer}
.b.s{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:5px 10px;font-size:13px}
.b.d{background:transparent;color:var(--no);border:1px solid var(--no);padding:5px 10px;font-size:13px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp div{background:var(--bg);border-radius:12px;padding:10px}
.kp span{display:block;font-size:12px;color:var(--mu)}.kp b{font-size:19px}
.it{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.it:last-child{border:0}.it .m{flex:1;min-width:150px}.it .m small{display:block;color:var(--mu);font-size:12px}
.tg{font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;border:1px solid}
.ok{color:var(--ok)}.no{color:var(--no)}.wa{color:var(--wa)}
.em{color:var(--mu);text-align:center;margin:8px 0}
#pv{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 30px}
#pv.on{display:block}
.bar{max-width:720px;margin:0 auto 10px;display:flex;gap:8px}
.inv{max-width:720px;margin:0 auto;background:#fff;color:#111;border-radius:6px;padding:26px}
.inv .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid #111;padding-bottom:12px}
.inv img{max-height:70px;max-width:160px}
.inv table{width:100%;border-collapse:collapse;margin:14px 0}
.inv th,.inv td{padding:8px;border-bottom:1px solid #ddd;text-align:right}
.inv .t{text-align:left;font-weight:800}
:root[data-th="alpha"]{--bg:#eef4f7;--sf:#fff;--ink:#1c3558;--mu:#5d7287;--ln:#d3e1e8;--ac:#1c4673;--ai:#fff;--ok:#0a8f86;--no:#e8602c;--wa:#c9791a}
:root[data-th="night"]{--bg:#0f1226;--sf:#1a1e3a;--ink:#f2f2fa;--mu:#9a9fc4;--ln:#2e3358;--ac:#f5b942;--ai:#1a1200;--ok:#4cc99b;--no:#ff8a75;--wa:#f0b24a}
:root[data-th="warm"]{--bg:#fff4ea;--sf:#fff;--ink:#3a2418;--mu:#8a6a58;--ln:#f0d8c6;--ac:#e8641a;--ai:#fff;--ok:#2e7d4f;--no:#c0392b;--wa:#a86a00}
:root[data-th="violet"]{--bg:#f4f0fb;--sf:#fff;--ink:#2a1b4a;--mu:#766a95;--ln:#e0d7f2;--ac:#6d3fd0;--ai:#fff;--ok:#1f8a5f;--no:#c93c5a;--wa:#a86a00}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:10px}.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px;font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--ac);color:var(--ai)}
.hd{display:flex;align-items:center;gap:10px;margin:6px 0}.hd h1{margin:0;font-size:20px}.lg{background:#fff;border-radius:12px;padding:4px 8px;display:flex}.lg img{height:44px;max-width:130px;display:block}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th,.tb td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}.tb tr.t td{font-weight:800}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid var(--ln);cursor:pointer;padding:0}
.sw button.on{border-color:var(--ink)}
@media print{body>main,.bar{display:none!important}#pv{position:static;padding:0;background:#fff;display:block!important}.inv{box-shadow:none}}
#lg{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#lf{width:100%;max-width:360px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
#lf h2{margin:0;font-size:18px;text-align:center}
#lf .lgi{align-self:center;background:#fff;border-radius:12px;padding:4px 8px;display:flex}#lf .lgi img{height:48px;max-width:150px}
#lM{min-height:1.6em;margin:0;text-align:center;font-size:13px}
</style>
</head>
<body>
<div id="lg"><form id="lf"><span class="lgi"><img id="ll" alt=""></span><h2>تسجيل الدخول</h2>
<input id="lE" type="email" dir="ltr" autocomplete="username" placeholder="البريد الإلكتروني" required>
<input id="lP" type="password" dir="ltr" autocomplete="current-password" placeholder="كلمة السر" required>
<p id="lM" class="em">جارٍ التحميل…</p>
<button class="b" id="lB" type="submit">دخول</button></form></div>
<main>
<div class="hd"><span class="lg"><img id="hl" alt="Alpha Graphics"></span><h1 id="ttl">Alpha Graphics</h1></div>
<p class="sync" id="sync">جارٍ الاتصال بالمزامنة…</p>
<nav id="nav">
<button data-t="ex" class="on">المصروفات والمدخول</button><button data-t="home">التقرير</button><button data-t="inv">الفواتير</button><button data-t="cl">العملاء</button><button data-t="q">عروض الأسعار</button><button data-t="yr">التقرير السنوي</button><button data-t="st">الإعدادات</button>
</nav>

<div class="tab" id="t-home">
<section><div class="r"><input type="month" id="mo"></div><div class="kp" id="kp"></div></section>

<section><h2>أكثر العملاء فواتير</h2><div id="tc"></div></section>
</div>

<div class="tab" id="t-inv">
<section><h2>فاتورة جديدة</h2>
<div class="r"><select id="iC"></select><input type="date" id="iD"></div>
<textarea id="iL" placeholder="كل سطر بند: الوصف | المبلغ&#10;تصميم هوية | 1500&#10;حملة سوشيال ميديا | 3000"></textarea>
<div class="r" style="margin-top:8px"><button class="b" id="iAdd">حفظ الفاتورة</button></div></section>
<section><h2>الفواتير</h2><div id="iList"></div></section>
</div>

<div class="tab" id="t-cl">
<section><h2>عميل جديد</h2><div class="r"><input id="cN" placeholder="اسم العميل"><input id="cP" placeholder="الهاتف"><button class="b" id="cAdd">إضافة</button></div></section>
<section><div id="cList"></div></section>
</div>

<div class="tab on" id="t-ex">
<section><h2>عملية جديدة</h2><div class="seg"><button id="xO" class="on">مصروف</button><button id="xI">مدخول</button></div>
<div class="r"><input id="eA" type="number" inputmode="decimal" placeholder="المبلغ"><input id="eD" type="date"><select id="eK"></select></div>
<div class="r"><input id="eN" placeholder="ملاحظة"><button class="b" id="eAdd">حفظ</button></div></section>
<section><div id="eList"></div></section>
</div>

<div class="tab" id="t-q">
<section><h2>عرض سعر جديد</h2>
<div class="r"><select id="qC"></select><input type="date" id="qD"></div>
<textarea id="qL" placeholder="كل سطر بند: الوصف | المبلغ&#10;تصميم هوية | 1500&#10;حملة سوشيال ميديا | 3000"></textarea>
<div class="r" style="margin-top:8px"><button class="b" id="qAdd">حفظ عرض السعر</button></div></section>
<section><h2>عروض الأسعار</h2><div id="qList"></div></section>
</div>

<div class="tab" id="t-yr">
<section><div class="r"><input type="number" id="yy" min="2000" max="2100" aria-label="السنة"></div><div id="yt" style="overflow-x:auto"></div></section>
<section><div class="r"><button class="b" id="yX">تصدير التقرير السنوي (Excel)</button><button class="b s" id="yT">تصدير كل العمليات (Excel)</button></div></section>
</div>

<div class="tab" id="t-st">
<section><h2>بيانات الشركة (تظهر في الفاتورة)</h2>
<div class="r"><input id="sN" placeholder="اسم الشركة"><input id="sP" placeholder="هاتف أو بريد"></div>
<div class="r"><input id="sT" type="number" placeholder="نسبة الضريبة ٪ (اتركها فارغة إن لم توجد)"><input id="sC" placeholder="العملة (مثال: جنيه مصري)"></div>
<div class="r"><div><label>الشعار</label><input type="file" id="sL" accept="image/*"></div></div>
<div class="r"><button class="b" id="sSave">حفظ الإعدادات</button></div></section>
<section><h2>المظهر</h2><div class="sw" id="sw"></div></section>
<section><h2>الحساب</h2><p class="sync" id="who"></p><button class="b d" id="lo" type="button">تسجيل الخروج</button></section>
</div>
</main>

<div id="pv"><div class="bar"><button class="b" id="pPrint">طباعة / PDF</button><button class="b s" id="pSave">حفظ كملف</button><button class="b s" id="pImg">حفظ كصورة</button><button class="b s" id="pClose">إغلاق</button></div><div class="inv" id="pvb"></div></div>
